apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io/

spec:
  project: default
  source:
    repoURL: 'https://github.com/duttap06/ocp_ingress.git'
    path: hunt/deploy-resources
    targetRevision: e2e
  destination:
    name: in-cluster
  syncPolicy:      
#   automated: {}
