apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: createresources
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - managedNamespaceMetadata=true    
      - Replace=true
      - PruneLast=true            
    automated:
      prune: true
      selfHeal: true
  project: default
  source:
    repoURL: 'https://github.com/duttap06/ocp_ingress.git'
    path: hunt/deploy-resources
    targetRevision: e2e
  destination:
    name: in-cluster
