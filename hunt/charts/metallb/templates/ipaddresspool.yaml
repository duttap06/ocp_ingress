{{- $_ := .Values.metallb.pool_addresses | required ".Values.metallb.pool_addresses is required." -}}
{{- if lt (len .Values.metallb.pool_addresses) 1 }}
{{- fail "metallb.pool_addresses must have at least one address" -}}
{{- end }}

---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: ingress-mesh-ipaddress-pool
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    kustomize.config.k8s.io/behavior: "replace"
spec:
  addresses:
{{- range .Values.metallb.pool_addresses }}
    - {{ . }}
{{- end }}
  autoAssign: true
  avoidBuggyIPs: false
